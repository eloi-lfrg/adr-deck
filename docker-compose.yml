# adr-deck — local usage only: the port is bound to 127.0.0.1.
# Point ADR_DATA_DIR to a directory holding MADR files (or a project with docs/decisions).
services:
  adr-deck:
    build: .
    image: adr-deck:latest
    container_name: adr-deck
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADR_PORT:-8787}:8787'
    volumes:
      - '${ADR_DATA_DIR:-./workspace}:/data'
